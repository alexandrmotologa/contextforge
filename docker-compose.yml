version: '3.8'

services:
  contextforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextforge
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CONTEXTFORGE_HOST=0.0.0.0
      - CONTEXTFORGE_PORT=8000
      - CONTEXTFORGE_UPSTREAM_URL=http://host.docker.internal:11434
      - CONTEXTFORGE_DEFAULT_STRATEGY=auto
      - CONTEXTFORGE_TARGET_RATIO=0.45
      - CONTEXTFORGE_PRESERVE_RECENT_TURNS=3
      - CONTEXTFORGE_RECENT_TOKEN_BUDGET=4096
      - CONTEXTFORGE_PROMETHEUS_ENABLED=true
      - CONTEXTFORGE_DB_PATH=/app/data/contextforge.db
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
